<header class="sigma_header style-6 can-sticky">
  
    <div class="sigma_header-bottom aside-toggle">
        <div class="container">
        
            <div class="navbar" (click)="toggleNav()">

                <ul class="sigma_header-controls-inner">
                    <li class="aside-toggle aside-trigger">
                            
                        <span></span>
                        <span></span>
                        <span></span>
                    </li>
                </ul>
   
               
            </div>

            
        
        </div>

    </div>

    <div class="sigma_header-bottom aside-toggle mobile-toggle">
        <div class="container">
        
           
   
                <div class="col-sm" ><a href="tel:{{location.phone}}"    style="color:white ; font-weight: bolder;"   class="btn-md">
                    <i class="fa fa-phone-square"></i> {{location.phone}}</a>
                    <a (click)="onInquireClick()" class="btn-md " style="color:white ; font-weight: bolder;">
                        <i class="fa fa-calendar"></i> Inquire Now</a>
                </div>
            

            
        
        </div>

    </div>

        <div class="container">
            <div class="navbar" *ngIf="!hideMenu">
                <ul class="navbar-nav">
                    <li class="menu-item" [ngClass]="hasChildren(item) ? 'menu-item-has-children' : ''"
                        *ngFor="let item of navigation">
                        <a href="javascript:void(0)" *ngIf="!hasLink(item)" title="{{item.desc}}">{{item.desc}}</a>
                        <a routerLink="/{{commonService.location}}/{{item.path}}"
                            *ngIf="hasLink(item)" title="{{item.desc}}  at Aerosports {{commonService.location}}">{{item.desc}}</a>
                        <ul class="sub-menu" *ngIf="hasChildren(item)" [ngClass]="item.open ? 'd-block' : ''">
                            <li class="menu-item"  [ngClass]="hasChildren(citem) ? 'menu-item-has-children' : ''"
                                *ngFor="let citem of item.children">
                                <a href="javascript:void(0)" *ngIf="hasChildren(citem)">{{citem.desc}}</a>
                                <a routerLink="/{{commonService.location}}/{{citem.path}}"
                                    *ngIf="!hasChildren(citem)" title="{{citem.desc}}  at Aerosports {{commonService.location}}" >{{citem.desc}}</a>

                                    </li>
                                </ul> -->
                            </li>
                        </ul>
                    </li>
                </ul>
                
                
                
                <a (click)="onInquireClick()" class="btn-sm " style="color:white ; font-weight: bolder;" title="Query to aerosports" >
                    <i class="fa fa-calendar"></i> Inquire Now</a>
                <div class="sigma_header-controls style-2 d-flex">
                    <ul class="sigma_header-controls-inner">

            </div>
        </div>
    </div>

</header>
<!-- Search -->
<div class="search-form-wrapper" [ngClass]="searchmethod ? '' : 'open'">
    <div class="search-trigger sigma_close" (click)="searchToggle()">
        <span></span>
        <span></span>
    </div>
    <form class="search-form">
        <input type="text" placeholder="Search...">
        <button type="submit" class="search-btn sigma_btn-custom">
            <i class="fal fa-search m-0"></i>
        </button>
    </form>

</div>
<!-- Canvas -->
<aside class="sigma_aside sigma_aside-desktop" [ngClass]="canvasmethod ? '' : 'aside-right-open'">
    <app-canvas></app-canvas>
</aside>
<div class="sigma_aside-overlay aside-trigger-right" (click)="canvasToggle()"></div>
<!-- Canvas -->
<aside class="sigma_aside" [ngClass]="navmethod ? '' : 'aside-open'">
    <div class="sigma_close aside-trigger" (click)="toggleNav()">
        <span></span>
        <span></span>
    </div>
    <app-mobile-menu></app-mobile-menu>
</aside>
<a id='logo' routerLink="/{{commonService.location}}" title="Aerosports {{commonService.location}} home page" ><img src="/assets/image/logo/logo_white.png" alt="Aerosports Logo" /></a>
<h1> {{page.title}} <small ><div [innerHTML]="page.smalltext"></div></small><small><a href="{{getroller()}}" target="_blank" class="sigma_btn-custom" title="Booking Now">Book Now<i class="far fa-arrow-right"  ></i></a></small>
<small> <a href="{{getconfig('waiver')}}" target="_blank" class="sigma_btn-custom" title="Waiver Link for Aerosports {{commonService.location}}" >Waiver<i class="far fa-arrow-right"  ></i> </a></small>
  
</h1>

<!-- You can add more ".slideshow-image" elements, but remember to update the "$items" variable on SCSS -->
<div class="slideshow" >
    <ng-container  *ngFor="let item of page.headerimage.split(',')">
         <div class="slideshow-image lazyload" style="background-image: url('{{item}}')"></div>  
    </ng-container>
</div>
