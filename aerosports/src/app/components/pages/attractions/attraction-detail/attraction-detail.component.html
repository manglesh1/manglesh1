<app-header></app-header>

<app-contact *ngIf="page.path=='contact-us'" ></app-contact>


<section>          


<div class="container" *ngIf="page.path!='contact-us'"  >
<br/><br/>
<!--<div *ngIf="page.section1.startsWith('http')">
    <iframe  scrolling="no" [style]="style" width="100%" height="100%" frameborder="0"    [src]="urlSafe"></iframe>

    </div>-->
<div class="detailedContent"  >
<div [innerHTML]="page.section1"></div>

</div>

<div id="#detailedContent" class="detailedContent"  >
    
        <div *ngIf="page.ruleyes!=''">
        <h4><i>{{page.desc}} Rules</i></h4>
        <h5>Always</h5>
       
        <ul class="pinklist" >
            <li *ngFor="let item of page.ruleyes.split(';')">{{item}}</li>
        </ul>
    
        </div>
        <div *ngIf="page.ruleno!=''">
        
        <h5>DO NOT</h5>
        <ul class="pinklist" style="padding-left:10px;">
            <li *ngFor="let item of page.ruleno.split(';')">{{item}}</li>
        </ul>
        </div>
        <div *ngIf="page.warnings!=''">
        <h5>WARNINGS</h5>
        <ul class="pinklist">
            <li *ngFor="let item of page.warnings.split(';')">{{item}}</li>
        </ul>
       </div>
    </div>
</div>
</section>
<app-footer [layout]="footerStyle"></app-footer>
