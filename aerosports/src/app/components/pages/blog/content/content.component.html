<div class="section">
    <div class="container">
        <div class="row">
            <!-- Article Start -->
            <div class="col-md-4" *ngFor="let item of blogs | paginate: { itemsPerPage: 6, currentPage: page }">
                <article class="sigma_post">
                    <div class="sigma_post-thumb">
                        <a href="/{{item.path}}">   <img [src]="item.smallimage" [alt]="item.title">
                        </a>
                        <div class="sigma_post-date" [innerHtml]="item.pageid">
                        </div>
                    </div>
                    <div class="sigma_post-body">                        
                        <h5> <a routerLink="/{{item.path}}">{{item.title | slice:0:50}}</a> </h5>
                        <a routerLink="/{{item.path}}" class="btn-link">Continue Reading <i class="far fa-arrow-right"></i> </a>
                    </div>
                </article>
            </div>
            <!-- Article End -->
        </div>
        <!-- Pagination Start -->
        <div class="pagination-wrap pagination mb-0">
            <pagination-controls (pageChange)="page = $event" responsive="true" previousLabel="<" nextLabel=">">
            </pagination-controls>
        </div>
        <!-- Pagination End -->
    </div>
</div>
