<div class="section section-padding light-bg">
  <div class="spacer bg-white spacer-lg spacer-bottom"></div>
  <div class="container">
    <div class="section-title text-center">
      <h6 class="subtitle"><span></span> Popular Stories <span></span></h6>
      <h4 class="title" style="color: aqua">Every Updated Article</h4>
    </div>
    <div class="row">
      <!-- Article Start -->
      <div
        class="col-md-4"
        *ngFor="let item of blogs | slice : 0 : 3" >
        <article class="sigma_post">
          <div class="sigma_post-thumb">
            <a  href="/{{ commonService.location }}/{{item.path}}" ><img [src]="item.smallimage" [alt]="item.title" class="lazyload" />
            </a>
            <div              class="sigma_post-date"   ><span>1</span></div>
          </div>
          <div class="sigma_post-body">
            <h5>
              <a  href="/{{ commonService.location }}/{{item.path}}">{{ item.title | slice : 0 : 50 }}</a>
            </h5>
            <a   href="/{{ commonService.location }}/{{item.path}}" class="btn-link" >Continue Reading <i class="far fa-arrow-right"></i>
            </a>
          </div>
        </article>
      </div>
      <!-- Article End -->
    </div>
  </div>
</div>
