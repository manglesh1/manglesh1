<section class="location-attractions">

 
<div  class="container"  >
    <div class="row" >
        <div class="col-25 hidden-sm-down" >
          <div class="col-100 col-md-50 text-center">
            <h2>There is so much to do at aerosports!</h2>
            <p class="location-attractions-strapline">Every park feature and all the fun includes in your Aerosports hourly or multi visit pass. Prepare 
                yourself to fly over our huge trampoline areas. duck and dive through extreme dodgeball and dunk your heart out in the slam zone.
            </p>
            <div class="col-25 hidden-sm-down">
              <a href="https://www.aerosportsparks.ca/{{commonService.location}}/attractions" class="cta cta-light-green">Explore attractions</a>
          </div>
          </div>
        </div>
    </div>
    <div class="row">
      
      <div class="col-100 col-md-33" *ngFor="let item of currentPage.children | slice : 0 : 10">

        <a  routerLink="/{{commonService.location}}/{{pagetype}}/{{item.path}}">
            <figure class="location-attractions-figure">
                <div class="location-attractions-img-container" data-video="https://player.vimeo.com/video/766814348?h=5da294b4cb&amp;amp;badge=0&amp;amp;autopause=0&amp;amp;player_id=0&amp;amp;app_id=58479">
                    <img src="{{item.icon}}" alt="{{item.path}}" class="lazyload" >                               
                <!--<iframe src="./Ashford&#39;s Biggest &amp; Best Indoor Trampoline &amp; Adventure Park!_files/766814348.html" title="0" sidedock="0" controls="0" frameborder="0" allowfullscreen=""></iframe>-->
                </div>
                <figcaption class="location-attractions-caption">
                  {{item.desc}}
                </figcaption>
            </figure>
        </a>
    </div>        
    </div>
  </div>
  </section>
